<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="NuvioTV">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f6fa"/><stop offset="1" stop-color="#e6e9f2"/></linearGradient>
<radialGradient id="halo" cx=".78" cy=".45" r=".55"><stop offset="0" stop-color="#2f6bff" stop-opacity=".14"/><stop offset="1" stop-color="#2f6bff" stop-opacity="0"/></radialGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".18"/></filter>
<filter id="lift" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity=".28"/></filter>
<linearGradient id="g0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff375f"/><stop offset="1" stop-color="#ff9f0a"/></linearGradient><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5e5ce6"/><stop offset="1" stop-color="#64d2ff"/></linearGradient><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#30d158"/><stop offset="1" stop-color="#00c7be"/></linearGradient><linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bf5af2"/><stop offset="1" stop-color="#ff375f"/></linearGradient><linearGradient id="g4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd60a"/><stop offset="1" stop-color="#ff9f0a"/></linearGradient>
<style>
    .card{transform-box:fill-box;transform-origin:50% 60%;animation:focus 10s cubic-bezier(.2,.8,.2,1) infinite;filter:url(#soft)}
    @keyframes focus{0%{transform:scale(1) translateY(0);opacity:.72}
      5.0%{transform:scale(1.14) translateY(-6px);opacity:1;filter:url(#lift)}
      17.0%{transform:scale(1.14) translateY(-6px);opacity:1;filter:url(#lift)}
      22.0%,100%{transform:scale(1) translateY(0);opacity:.72}}
    .t{font:700 64px -apple-system,'SF Pro Display','Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#1d1d1f;letter-spacing:-1.5px}
    .s{font:500 22px -apple-system,'SF Pro Text','Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#6e6e73}
    .k{font:600 14px ui-monospace,'SF Mono',Menlo,Consolas,monospace;fill:#2f6bff;letter-spacing:2px}
    .bar{animation:sweep 6s ease-in-out infinite}
    @keyframes sweep{0%{width:0}70%{width:220px}100%{width:220px;opacity:0}}
    @media (prefers-reduced-motion:reduce){.card,.bar{animation:none}}</style>
</defs>
<rect width="1200" height="320" rx="24" fill="url(#bg)"/>
<rect width="1200" height="320" rx="24" fill="url(#halo)"/>
<text x="72" y="104" class="k">NATIVE TVOS · SWIFTUI</text>
<text x="72" y="178" class="t">NuvioTV</text>
<text x="72" y="222" class="s">Nuvio, made for Apple TV.</text>
<rect x="72" y="250" height="4" rx="2" fill="#2f6bff" class="bar" width="220"/>
<g class="card" style="animation-delay:0s"><rect x="512" y="88" width="104" height="156" rx="14" fill="url(#g0)"/><rect x="512" y="88" width="104" height="156" rx="14" fill="url(#sheen)"/><rect x="524" y="218" width="57" height="8" rx="4" fill="#fff" fill-opacity=".55"/></g><g class="card" style="animation-delay:2s"><rect x="638" y="88" width="104" height="156" rx="14" fill="url(#g1)"/><rect x="638" y="88" width="104" height="156" rx="14" fill="url(#sheen)"/><rect x="650" y="218" width="57" height="8" rx="4" fill="#fff" fill-opacity=".55"/></g><g class="card" style="animation-delay:4s"><rect x="764" y="88" width="104" height="156" rx="14" fill="url(#g2)"/><rect x="764" y="88" width="104" height="156" rx="14" fill="url(#sheen)"/><rect x="776" y="218" width="57" height="8" rx="4" fill="#fff" fill-opacity=".55"/></g><g class="card" style="animation-delay:6s"><rect x="890" y="88" width="104" height="156" rx="14" fill="url(#g3)"/><rect x="890" y="88" width="104" height="156" rx="14" fill="url(#sheen)"/><rect x="902" y="218" width="57" height="8" rx="4" fill="#fff" fill-opacity=".55"/></g><g class="card" style="animation-delay:8s"><rect x="1016" y="88" width="104" height="156" rx="14" fill="url(#g4)"/><rect x="1016" y="88" width="104" height="156" rx="14" fill="url(#sheen)"/><rect x="1028" y="218" width="57" height="8" rx="4" fill="#fff" fill-opacity=".55"/></g>
</svg>